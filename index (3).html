:root {
  --bg: #0b0d10;
  --fg: #f3f5f7;
  --muted: #98a2ae;
  --accent: #f2a93b;
  --glass: rgba(255, 255, 255, .055);
  --glass-line: rgba(255, 255, 255, .11);
  --wa-1: #34e284;
  --wa-2: #16b45a;
  --wa-ink: #04230f;
  --font-display: "Lalezar", "Vazirmatn", Tahoma, sans-serif;
  --font-body: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  background: transparent;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; text-decoration: none; touch-action: manipulation; }
.page { position: relative; max-width: 440px; margin-inline: auto; isolation: isolate; }

/* background: looping showroom video at the top, dimmed and faded into the page so text and buttons stay readable */
.bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: var(--bg); }
.vwrap {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 560px; aspect-ratio: 4 / 3;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 42%, transparent 80%), linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(180deg, #000 0%, #000 42%, transparent 80%), linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  mask-composite: intersect;
}
.vwrap video { display: block; width: 100%; height: 100%; object-fit: cover; filter: brightness(.66) saturate(1.1) contrast(1.05); }
.vwrap::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 13, 16, .5) 0%, rgba(11, 13, 16, .15) 55%, transparent 100%); }

.hero { text-align: center; padding: 52px 0 8px; }
.avatar {
  width: 118px; height: 118px; margin: 0 auto 18px; border-radius: 50%; padding: 3px;
  background: conic-gradient(from 200deg, #f2a93b, #fff2d2 20%, #f2a93b 38%, #8a5608 64%, #f2a93b);
  box-shadow: 0 0 0 8px rgba(242, 169, 59, .13), 0 22px 44px rgba(0, 0, 0, .45);
}
.avatar img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); }
h1 { margin: 0; text-shadow: 0 2px 22px rgba(0, 0, 0, .55); font-family: var(--font-display); font-weight: 400; font-size: 46px; line-height: 1.2; }
.city { text-shadow: 0 1px 12px rgba(0, 0, 0, .7); display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--accent); font-weight: 700; font-size: 14px; }
.city svg { width: 16px; height: 16px; }
.tagline { margin: 10px auto 0; max-width: 28ch; color: #d7dde4; text-shadow: 0 1px 14px rgba(0, 0, 0, .7); font-weight: 500; font-size: 15px; text-wrap: balance; }

.actions { display: flex; flex-direction: column; gap: 14px; margin-top: 34px; }

.wa {
  display: flex; align-items: center; gap: 14px; min-height: 78px; padding: 12px 14px 12px 20px;
  border-radius: 24px; color: var(--wa-ink);
  background: linear-gradient(135deg, var(--wa-1), var(--wa-2));
  box-shadow: 0 16px 36px -12px rgba(37, 211, 102, .6), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.wa .ic { flex: none; width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; background: rgba(4, 35, 15, .14); }
.wa .ic svg { width: 32px; height: 32px; }
.wa .t { flex: 1; font-weight: 800; font-size: 20px; line-height: 1.3; }
.wa .ar { flex: none; width: 22px; height: 22px; opacity: .75; }

.tel {
  display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 14px;
  border-radius: 24px; background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transition: border-color .15s ease, background .15s ease;
}
.tel:hover { border-color: rgba(242, 169, 59, .6); }
.tel .ic, .tel .go { flex: none; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; }
.tel .ic { background: rgba(242, 169, 59, .14); color: var(--accent); }
.tel .go { background: rgba(255, 255, 255, .06); color: var(--muted); }
.tel .ic svg { width: 24px; height: 24px; }
.tel .go svg { width: 20px; height: 20px; }
.tel .n { flex: 1; text-align: center; direction: ltr; font-weight: 700; font-size: 24px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }

.wa:active, .tel:active { transform: scale(.98); }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.avatar, .actions > * { animation: rise .55s cubic-bezier(.2, .7, .2, 1) both; }
.actions > :nth-child(1) { animation-delay: .05s; }
.actions > :nth-child(2) { animation-delay: .12s; }
.actions > :nth-child(3) { animation-delay: .19s; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
